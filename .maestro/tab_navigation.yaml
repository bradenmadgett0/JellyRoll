appId: com.jellyroll.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "home-empty-title"
    timeout: 45000
- tapOn:
    id: "tab-library"
- assertVisible:
    id: "library-empty-title"
- tapOn:
    id: "tab-manage"
- assertVisible:
    id: "manage-empty-title"
- tapOn:
    id: "tab-settings"
- extendedWaitUntil:
    visible:
      id: "settings-empty-servers"
    timeout: 30000
- tapOn:
    id: "tab-home"
- assertVisible:
    id: "home-empty-title"
