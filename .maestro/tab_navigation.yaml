appId: com.jellyroll.app
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to JellyRoll"
- tapOn: ".*Library.*"
- assertVisible: "No Library Connected"
- tapOn: ".*Manage.*"
- assertVisible: "No Management Servers"
